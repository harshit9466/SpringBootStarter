# =============================================================================
# DOCKER COMPOSE — Local Observability Stack
# =============================================================================
# Yeh compose file spin up karta hai:
#   1. Prometheus  (port 9090) — Metrics collection & PromQL
#   2. Grafana     (port 3000) — Dashboards & Alerting (Module 6 mein use)
#   3. Tempo       (port 3200, OTLP 4317/4318) — Distributed tracing (Module 8 mein use)
#   4. Loki        (port 3100) — Log aggregation (Module 7 mein use)
#
# Spring Boot app is compose mein NAHI hai — host pe seedha chalta rahega.
# WHY: Development mein Spring Boot restart karana fast hota hai bina Docker ke.
#      Prometheus + Grafana stable infra hain, inhe containerize karo.
#
# USAGE:
#   Start:  docker-compose up -d
#   Stop:   docker-compose down
#   Logs:   docker-compose logs -f prometheus
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Time-Series Database + Scraper
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped

    ports:
      # 9090: Prometheus UI + API (http://localhost:9090)
      - "9090:9090"

    volumes:
      # Mount our custom scrape config into the container.
      # :ro = read-only (container cannot modify it — good practice).
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

      # Named volume for TSDB data persistence.
      # WHY named volume: docker-compose down karoge to data safe rahega.
      # Without this: every restart = fresh Prometheus, no historical data.
      - prometheus_data:/prometheus

    command:
      # --config.file: Custom config location (we mounted it above)
      - '--config.file=/etc/prometheus/prometheus.yml'

      # --storage.tsdb.path: TSDB data directory inside container
      - '--storage.tsdb.path=/prometheus'

      # --storage.tsdb.retention.time: Kitne din ka data rakhna hai.
      # Default: 15d. Hum 7d rakh rahe hain dev mein (disk save karo).
      - '--storage.tsdb.retention.time=7d'

      # --web.enable-lifecycle: Allows hot-reload of config via HTTP POST.
      # curl -X POST http://localhost:9090/-/reload
      # WHY: Scrape config change karo bina restart ke.
      - '--web.enable-lifecycle'

      # --web.console.libraries and --web.console.templates:
      # Built-in Prometheus console templates (basic dashboards)
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

    networks:
      - observability

    extra_hosts:
      # host.docker.internal: Linux containers ke liye yeh manually add karna padta hai.
      # Windows/Mac Docker Desktop pe automatic hota hai, but Linux pe nahi.
      # Adds host-gateway as host.docker.internal DNS entry.
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # GRAFANA — Visualization & Dashboards (Module 6 mein configure karenge)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped

    ports:
      # 3000: Grafana UI (http://localhost:3000)
      - "3000:3000"

    environment:
      # Default admin credentials (change in production!)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

      # Disable Grafana's own signup page
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      # Named volume for Grafana data (dashboards, users, settings)
      - grafana_data:/var/lib/grafana

      # Provisioning: datasources + dashboards automatically load at startup.
      # :ro = Grafana can read but not modify our source files.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro

      # Dashboard JSON files (version controlled — dashboards as code)
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

    networks:
      - observability

  # ---------------------------------------------------------------------------
  # LOKI — Log Aggregation (Module 7)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    restart: unless-stopped

    # Loki's official image runs as a non-root user by default. A freshly-created
    # Docker named volume (loki_data) is root-owned until something writes to it,
    # so Loki's own "mkdir /loki/chunks" fails with "permission denied" on first
    # boot — a well-documented, common issue with this exact image.
    # Running as root here is the pragmatic fix for LOCAL DEV. Real production
    # setups should keep Loki non-root and instead run a one-time init container
    # that does `chown` on the volume to Loki's actual UID before Loki starts —
    # not done here to keep this repo's docker-compose focused on local verification.
    user: "0:0"

    command:
      - '-config.file=/etc/loki/loki-config.yaml'

    ports:
      # 3100: Loki's push/query API. Spring Boot app (running on host, see note
      # at top of this file) sends logs here via loki-logback-appender, and
      # Grafana's Loki datasource queries here too.
      - "3100:3100"

    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

    networks:
      - observability

  # ---------------------------------------------------------------------------
  # TEMPO — Distributed Tracing Backend (Module 8)
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped

    command:
      - '-config.file=/etc/tempo.yaml'

    ports:
      # 3200: Tempo's own query API — Grafana's Tempo datasource connects here.
      - "3200:3200"
      # 4317/4318: OTLP receivers — gRPC and HTTP respectively.
      # Spring Boot app (running on host, see note at top of this file) sends
      # spans to 4318 (HTTP) per management.otlp.tracing.endpoint in
      # application-dev.properties.
      - "4317:4317"
      - "4318:4318"

    volumes:
      - ./docker/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

    networks:
      - observability

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  observability:
    # bridge: Default Docker network mode.
    # Containers is network pe ek doosre ko container name se resolve kar sakte hain.
    # e.g., Grafana Prometheus ko "prometheus:9090" se access karta hai.
    driver: bridge

# =============================================================================
# VOLUMES — Named volumes persist data across docker-compose down/up
# =============================================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
  loki_data:
    driver: local
