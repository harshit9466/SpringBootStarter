# src/main/resources/application-dev.properties

#server port number
server.port=8082

# =============================================================================
# SECURITY — OAuth2 Resource Server (Keycloak JWT)
# =============================================================================
# management.server.port: Actuator alag port pe — Spring Security sirf 8082 pe apply hoti hai.
# Port 9090 ko production mein firewall se internal-only rakhna.
management.server.port=9090

# NimbusJwtDecoder lazily fetch karta hai Keycloak public key — startup pe Keycloak
# unavailable ho toh bhi app start hoga. First JWT request pe connection hoga.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_BASE_URL:http://10.10.8.176:8080}/realms/${KEYCLOAK_REALM:BiharOne_Department}/protocol/openid-connect/certs

# =============================================================================
# SPRING BOOT ACTUATOR CONFIGURATION (DEV)
# =============================================================================
# management.endpoints.web.exposure.include
# → Controls WHICH actuator endpoints are accessible over HTTP.
# → Default: only "health" is exposed. Everything else is hidden.
# → In DEV we expose all (*) so we can explore during development.
# → In PROD: NEVER use * — expose only what DevOps/monitoring tools need.
#   Recommended prod set: health,info,metrics,prometheus
management.endpoints.web.exposure.include=*

# management.endpoint.health.show-details
# → Controls how much detail /actuator/health returns.
# → "always"      : show full component breakdown (DB status, disk, custom checks)
# → "when-authorized" : show details only to authenticated users (prod default)
# → "never"       : always return just UP/DOWN (most secure for prod)
# → In DEV "always" so we can see all health components while developing.
management.endpoint.health.show-details=always

# management.endpoint.health.show-components
# → Shows each HealthIndicator as a separate component in the response.
# → Without this, all indicators are merged into one UP/DOWN aggregate.
management.endpoint.health.show-components=always

# Liveness and Readiness probes — Kubernetes uses these
# Liveness  : Is the JVM alive? Should Kubernetes restart this pod?
# Readiness : Is the app ready to receive traffic? Should the load balancer route to it?
management.endpoint.health.probes.enabled=true

# management.info.env.enabled
# → Exposes application info (name, version, description) at /actuator/info
# → Reads properties prefixed with "info." from application.properties
management.info.env.enabled=true

# Application info shown at /actuator/info
info.app.name=@project.name@
info.app.version=@project.version@
info.app.description=@project.description@
info.app.java-version=@java.version@

# =============================================================================
# MICROMETER / PROMETHEUS CONFIGURATION (DEV)
# =============================================================================
# management.metrics.tags.application
# → Adds a global "application" tag to EVERY metric automatically.
#   In Prometheus, every metric will have: application="spring-boot-starter"
#   WHY: When you run multiple services and Prometheus scrapes all of them,
#   you need to know WHICH service a metric came from.
#   Without this tag, all services' metrics mix together — unusable.
management.metrics.tags.application=${spring.application.name}

# Prometheus endpoint — Prometheus server scrapes this URL every 15s
# Available at: GET http://localhost:8082/actuator/prometheus
# Without micrometer-registry-prometheus dependency this has no effect.
# With it, this endpoint exposes ALL metrics in Prometheus text format:
#   # HELP products_created_total Total number of products created
#   # TYPE products_created_total counter
#   products_created_total{application="spring-boot-starter"} 47.0

# Histogram percentiles for HTTP requests (auto-instrumented by Spring)
# publishPercentiles: pre-computed client-side (lower Prometheus cost)
# publishPercentileHistogram: sends raw buckets (Prometheus computes percentiles)
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

